name: Deploy to Pages Branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Set pnpm registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile
      
      # 安装 Butterfly 子项目依赖（Hexo）
      - name: Install Butterfly dependencies
        working-directory: ./classic
        run: npm install   # 使用 npm 安装（因为 classic/package.json 是 npm 项目）
      
      - name: Build site
        run: pnpm run deploy-all
      
      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: dist
          clean: true